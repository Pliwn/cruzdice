<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRUZ DICE</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root {
    --site: #00cfff;
    --site-dim: rgba(0,207,255,0.12);
    --site-glow: rgba(0,207,255,0.55);
    --site-pulse: rgba(0,207,255,0.22);
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{background:#000;color:var(--site);font-family:'Orbitron',monospace;min-height:100vh;overflow-x:hidden;position:relative}
  body::after{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.15) 2px,rgba(0,0,0,.15) 4px);pointer-events:none;z-index:1}
  .bg-grid{position:fixed;inset:0;z-index:0;display:grid;grid-template-columns:repeat(8,1fr);pointer-events:none}
  .bg-die{aspect-ratio:1;border:1px solid rgba(0,207,255,.055);border-radius:18%;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:18%;gap:8%}
  .bg-die.lit{border-color:rgba(0,207,255,.2)}
  .bg-dot{border-radius:50%;background:rgba(0,207,255,.05)}
  .bg-die.lit .bg-dot{background:rgba(0,207,255,.16)}
  .container{position:relative;z-index:2;max-width:880px;margin:0 auto;padding:38px 24px 60px;display:flex;flex-direction:column;align-items:center;gap:30px}
  .logo{font-size:clamp(2.2rem,8vw,4.6rem);font-weight:900;letter-spacing:.18em;color:var(--site);text-shadow:0 0 8px var(--site),0 0 28px var(--site-glow),0 0 70px var(--site-pulse);text-align:center;line-height:1}
  .logo span{color:#fff;text-shadow:0 0 8px #fff,0 0 24px var(--site),0 0 60px var(--site)}
  .tagline{font-family:'Share Tech Mono',monospace;font-size:.65rem;letter-spacing:.45em;color:var(--site);opacity:.5;margin-top:8px;text-align:center}
  .header-line{width:100%;height:1px;background:linear-gradient(90deg,transparent,var(--site),transparent);box-shadow:0 0 8px var(--site);margin-top:14px}

  /* panel */
  .panel{width:100%;border:1px solid var(--site);border-radius:4px;padding:26px 30px;background:transparent;box-shadow:0 0 18px var(--site-pulse),inset 0 0 18px var(--site-dim);position:relative}
  .panel::before,.panel::after{content:'';position:absolute;width:14px;height:14px;border-color:var(--site);border-style:solid}
  .panel::before{top:-1px;left:-1px;border-width:2px 0 0 2px}
  .panel::after{bottom:-1px;right:-1px;border-width:0 2px 2px 0}
  .panel-label{font-family:'Share Tech Mono',monospace;font-size:.58rem;letter-spacing:.4em;color:var(--site);opacity:.5;text-align:center;margin-bottom:16px}

  /* count buttons */
  .count-row{display:flex;justify-content:center;gap:10px;margin-bottom:26px}
  .count-btn{width:46px;height:46px;border:1px solid var(--site);background:transparent;color:var(--site);font-family:'Orbitron',monospace;font-size:1rem;font-weight:700;cursor:pointer;border-radius:3px;transition:all .2s;box-shadow:0 0 6px var(--site-pulse);position:relative;overflow:hidden}
  .count-btn::before{content:'';position:absolute;inset:0;background:var(--site);opacity:0;transition:opacity .2s}
  .count-btn:hover{box-shadow:0 0 16px var(--site);transform:translateY(-2px)}
  .count-btn.active{box-shadow:0 0 14px var(--site),0 0 32px var(--site-glow),inset 0 0 10px var(--site-dim);text-shadow:0 0 8px var(--site)}
  .count-btn.active::before{opacity:.12}

  /* color toggles */
  .color-row{display:flex;justify-content:center;gap:16px;flex-wrap:wrap}
  .color-toggle{position:relative;display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer}
  .color-toggle input{display:none}
  .color-swatch{width:48px;height:48px;border-radius:8px;border:2px solid var(--c);background:transparent;position:relative;transition:all .2s;box-shadow:0 0 8px var(--c)}
  .color-swatch::before{content:'';position:absolute;inset:5px;border-radius:4px;background:var(--c);opacity:.22;transition:opacity .2s}
  /* OFF cross */
  .color-swatch::after{content:'';position:absolute;inset:0;opacity:0;transition:opacity .2s;
    background:linear-gradient(135deg,transparent 42%,var(--c) 42%,var(--c) 58%,transparent 58%),
               linear-gradient(45deg, transparent 42%,var(--c) 42%,var(--c) 58%,transparent 58%);
    border-radius:6px}
  .color-toggle input:checked ~ .color-swatch{box-shadow:0 0 16px var(--c),0 0 34px color-mix(in srgb,var(--c) 45%,transparent),inset 0 0 10px color-mix(in srgb,var(--c) 22%,transparent)}
  .color-toggle input:checked ~ .color-swatch::before{opacity:.38}
  .color-toggle input:not(:checked) ~ .color-swatch{opacity:.28;box-shadow:none}
  .color-toggle input:not(:checked) ~ .color-swatch::after{opacity:.6}
  .color-toggle:hover .color-swatch{transform:scale(1.12)}
  .color-name{font-family:'Share Tech Mono',monospace;font-size:.48rem;letter-spacing:.18em;color:var(--c);opacity:.75;transition:opacity .2s;white-space:nowrap}
  .color-toggle input:not(:checked) ~ .color-name{opacity:.22}

  /* roll btn */
  .roll-btn{position:relative;padding:18px 64px;border:2px solid var(--site);background:transparent;color:var(--site);font-family:'Orbitron',monospace;font-size:1.5rem;font-weight:900;letter-spacing:.55em;cursor:pointer;border-radius:3px;transition:all .2s;box-shadow:0 0 18px var(--site-pulse),0 0 42px var(--site-dim),inset 0 0 14px var(--site-dim);text-shadow:0 0 14px var(--site),0 0 28px var(--site);overflow:hidden}
  .roll-btn::before{content:'';position:absolute;top:50%;left:50%;width:0;height:0;background:var(--site);opacity:.12;border-radius:50%;transform:translate(-50%,-50%);transition:width .4s,height .4s}
  .roll-btn:hover{box-shadow:0 0 32px var(--site),0 0 70px var(--site-glow),inset 0 0 22px var(--site-dim);transform:translateY(-3px);letter-spacing:.65em}
  .roll-btn:hover::before{width:340px;height:340px}
  .roll-btn:active{transform:translateY(0) scale(.97)}
  .roll-btn.rolling{animation:rollPulse .5s ease-out}
  @keyframes rollPulse{
    0%  {box-shadow:0 0 18px var(--site-pulse),inset 0 0 14px var(--site-dim)}
    50% {box-shadow:0 0 70px var(--site),0 0 130px var(--site-glow),inset 0 0 34px var(--site-pulse)}
    100%{box-shadow:0 0 18px var(--site-pulse),inset 0 0 14px var(--site-dim)}
  }

  /* dice area */
  .dice-area{width:100%;min-height:210px;border:1px solid var(--site);border-radius:4px;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:30px;padding:42px 28px 50px;position:relative;box-shadow:0 0 16px var(--site-pulse),inset 0 0 22px var(--site-dim)}
  .dice-area::before{content:'DICE OUTPUT';position:absolute;top:-10px;left:24px;background:#000;padding:0 10px;font-family:'Share Tech Mono',monospace;font-size:.55rem;letter-spacing:.35em;color:var(--site);opacity:.42}
  .empty-msg{font-family:'Share Tech Mono',monospace;font-size:.75rem;letter-spacing:.3em;color:var(--site);opacity:.22}

  /* die */
  .die-wrap{display:flex;flex-direction:column;align-items:center;gap:9px}
  .die{width:92px;height:92px;border-width:2px;border-style:solid;border-radius:14px;position:relative}
  .die::before,.die::after{content:'';position:absolute;width:12px;height:12px;border-style:solid;border-color:inherit;opacity:.55}
  .die::before{top:5px;left:5px;border-width:1px 0 0 1px}
  .die::after{bottom:5px;right:5px;border-width:0 1px 1px 0}
  .die.animate{animation:diceRoll .52s cubic-bezier(.36,.07,.19,.97) both}
  @keyframes diceRoll{
    0%  {transform:rotate(0deg) scale(1)}
    15% {transform:rotate(-20deg) scale(1.14) translateX(-7px)}
    32% {transform:rotate(24deg) scale(1.09) translateX(7px)}
    48% {transform:rotate(-13deg) scale(1.05) translateX(-4px)}
    64% {transform:rotate(9deg) scale(1.02) translateX(3px)}
    80% {transform:rotate(-4deg) scale(1.01)}
    100%{transform:rotate(0deg) scale(1)}
  }
  .die-color-tag{font-family:'Share Tech Mono',monospace;font-size:.6rem;letter-spacing:.22em;opacity:.78;text-transform:uppercase}
  /* sound toggle */
  .sound-btn{position:fixed;top:18px;right:22px;z-index:10;width:42px;height:42px;border:1px solid var(--site);background:transparent;color:var(--site);font-size:1.15rem;cursor:pointer;border-radius:3px;display:flex;align-items:center;justify-content:center;box-shadow:0 0 8px var(--site-pulse);transition:all .2s;line-height:1}
  .sound-btn:hover{box-shadow:0 0 16px var(--site);transform:scale(1.08)}
  .sound-btn.muted{opacity:.3;box-shadow:none}

  /* result bar */
  .result-bar{font-family:'Share Tech Mono',monospace;font-size:.67rem;letter-spacing:.28em;color:var(--site);opacity:.52;text-align:center}
  .result-bar strong{opacity:1;text-shadow:0 0 8px var(--site);font-style:normal}

  /* warn */
  .warn{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);border:1px solid #ff003c;color:#ff003c;font-family:'Share Tech Mono',monospace;font-size:.7rem;letter-spacing:.25em;padding:10px 24px;box-shadow:0 0 18px rgba(255,0,60,.5);background:#000;z-index:99;animation:fadeWarn 2.3s forwards;pointer-events:none}
  @keyframes fadeWarn{0%{opacity:0;transform:translateX(-50%) translateY(10px)}15%{opacity:1;transform:translateX(-50%) translateY(0)}80%{opacity:1}100%{opacity:0}}

  footer{font-family:'Share Tech Mono',monospace;font-size:.55rem;letter-spacing:.4em;color:var(--site);opacity:.18;text-align:center}
  @media(max-width:500px){.die{width:74px;height:74px;padding:8px}.roll-btn{font-size:1.1rem;padding:14px 40px}.count-btn{width:38px;height:38px}.color-swatch{width:40px;height:40px}}
</style>
</head>
<body>

<div class="bg-grid" id="bgGrid"></div>
<button class="sound-btn" id="soundBtn" title="Toggle Sound">&#128266;</button>

<div class="container">

  <header>
    <div class="logo">CRUZ <span>DICE</span></div>
    <div class="tagline">// COLOR ROLLER — TRON WIREFRAME //</div>
    <div class="header-line"></div>
  </header>

  <div class="panel">
    <div class="panel-label">[ DICE COUNT ]</div>
    <div class="count-row" id="countRow"></div>

    <div class="panel-label">[ COLOR POOL — CLICK TO TOGGLE ]</div>
    <div class="color-row" id="colorRow"></div>
  </div>

  <button class="roll-btn" id="rollBtn">ROLL</button>

  <div class="result-bar" id="resultBar" style="visibility:hidden">
    ROLLED <strong id="rCount">—</strong> DICE &nbsp;·&nbsp; ACTIVE COLORS: <strong id="rPool">—</strong>
  </div>

  <div class="dice-area" id="diceArea">
    <div class="empty-msg">_ AWAITING ROLL _</div>
  </div>

  <footer>CRUZ DICE &nbsp;·&nbsp; v2.0 &nbsp;·&nbsp; SYSTEM READY</footer>
</div>

<script>
const COLORS = [
  { id:'red',    hex:'#ff003c', label:'RED'    },
  { id:'orange', hex:'#ff6a00', label:'ORANGE' },
  { id:'yellow', hex:'#ffe600', label:'YELLOW' },
  { id:'green',  hex:'#00ff87', label:'GREEN'  },
  { id:'blue',   hex:'#00cfff', label:'BLUE'   },
  { id:'purple', hex:'#bf00ff', label:'PURPLE' },
];

let diceCount = 3;
const enabled = new Set(COLORS.map(c => c.id));

const countRow  = document.getElementById('countRow');
const colorRow  = document.getElementById('colorRow');
const rollBtn   = document.getElementById('rollBtn');
const diceArea  = document.getElementById('diceArea');
const resultBar = document.getElementById('resultBar');
const rCount    = document.getElementById('rCount');
const rPool     = document.getElementById('rPool');
const bgGrid    = document.getElementById('bgGrid');

/* count buttons */
for (let i = 1; i <= 6; i++) {
  const btn = document.createElement('button');
  btn.className = 'count-btn' + (i === diceCount ? ' active' : '');
  btn.textContent = i;
  btn.onclick = () => {
    diceCount = i;
    document.querySelectorAll('.count-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  };
  countRow.appendChild(btn);
}

/* color toggles */
COLORS.forEach(c => {
  const lbl = document.createElement('label');
  lbl.className = 'color-toggle';
  lbl.style.setProperty('--c', c.hex);

  const inp = document.createElement('input');
  inp.type = 'checkbox';
  inp.checked = true;
  inp.addEventListener('change', () => {
    if (!inp.checked && enabled.size <= 1) {
      inp.checked = true;
      showWarn('MINIMUM 1 COLOR REQUIRED');
      return;
    }
    inp.checked ? enabled.add(c.id) : enabled.delete(c.id);
  });

  const sw = document.createElement('div');
  sw.className = 'color-swatch';

  const nm = document.createElement('div');
  nm.className = 'color-name';
  nm.textContent = c.label;

  lbl.appendChild(inp);
  lbl.appendChild(sw);
  lbl.appendChild(nm);
  colorRow.appendChild(lbl);
});

/* ─── Sound System ─── */
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
let soundMuted = false;
const soundBtn = document.getElementById('soundBtn');

soundBtn.addEventListener('click', () => {
  soundMuted = !soundMuted;
  soundBtn.classList.toggle('muted', soundMuted);
  soundBtn.innerHTML = soundMuted ? '&#128263;' : '&#128266;';
});

function playRollSound() {
  if (soundMuted) return;
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const now = audioCtx.currentTime;
  const ticks = 6 + Math.floor(Math.random() * 4);
  for (let i = 0; i < ticks; i++) {
    const t = now + i * 0.055;
    // noise burst
    const bufSize = audioCtx.sampleRate * 0.04;
    const buf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
    const data = buf.getChannelData(0);
    for (let j = 0; j < bufSize; j++) data[j] = (Math.random() * 2 - 1);
    const src = audioCtx.createBufferSource();
    src.buffer = buf;
    // bandpass filter for woody click
    const bp = audioCtx.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.value = 800 + Math.random() * 600;
    bp.Q.value = 1.2;
    const gain = audioCtx.createGain();
    gain.gain.setValueAtTime(0.55 - i * 0.04, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.06);
    src.connect(bp);
    bp.connect(gain);
    gain.connect(audioCtx.destination);
    src.start(t);
    src.stop(t + 0.07);
  }
  // final thud
  const osc = audioCtx.createOscillator();
  const gFinal = audioCtx.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(120, now + ticks * 0.055);
  osc.frequency.exponentialRampToValueAtTime(60, now + ticks * 0.055 + 0.12);
  gFinal.gain.setValueAtTime(0.3, now + ticks * 0.055);
  gFinal.gain.exponentialRampToValueAtTime(0.001, now + ticks * 0.055 + 0.15);
  osc.connect(gFinal);
  gFinal.connect(audioCtx.destination);
  osc.start(now + ticks * 0.055);
  osc.stop(now + ticks * 0.055 + 0.16);
}

/* roll */
function roll() {
  const pool = COLORS.filter(c => enabled.has(c.id));
  if (!pool.length) { showWarn('NO COLORS ACTIVE'); return; }

  rollBtn.classList.remove('rolling');
  void rollBtn.offsetWidth;
  rollBtn.classList.add('rolling');

  diceArea.innerHTML = '';

  playRollSound();

  for (let i = 0; i < diceCount; i++) {
    const color = pool[Math.floor(Math.random() * pool.length)];
    const [r,g,b] = [
      parseInt(color.hex.slice(1,3),16),
      parseInt(color.hex.slice(3,5),16),
      parseInt(color.hex.slice(5,7),16)
    ];

    const wrap = document.createElement('div');
    wrap.className = 'die-wrap';

    const die = document.createElement('div');
    die.className = 'die';
    die.style.borderColor = color.hex;
    die.style.boxShadow = `0 0 16px rgba(${r},${g},${b},.7),0 0 36px rgba(${r},${g},${b},.35),inset 0 0 14px rgba(${r},${g},${b},.12)`;
    die.style.background = `rgba(${r},${g},${b},.04)`;

    const idx = i;
    setTimeout(() => {
      die.classList.add('animate');
      die.addEventListener('animationend', () => die.classList.remove('animate'), {once:true});
    }, idx * 65);

    const tag = document.createElement('div');
    tag.className = 'die-color-tag';
    tag.style.color = color.hex;
    tag.style.textShadow = `0 0 8px ${color.hex}`;
    tag.textContent = color.label;

    wrap.appendChild(die);
    wrap.appendChild(tag);
    diceArea.appendChild(wrap);
  }

  rCount.textContent = diceCount;
  rPool.textContent  = pool.map(c => c.label).join(' · ');
  resultBar.style.visibility = 'visible';
}

rollBtn.addEventListener('click', roll);
document.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); roll(); }
});

/* warn toast */
function showWarn(msg) {
  const el = document.createElement('div');
  el.className = 'warn';
  el.textContent = '\u26A0 ' + msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2400);
}

/* bg grid */
const BG_FACES = [[5],[1,9],[1,5,9],[1,3,7,9],[1,3,5,7,9],[1,3,4,6,7,9]];
function buildBg() {
  bgGrid.innerHTML = '';
  const cols = 8;
  const rows = Math.ceil(window.innerHeight / (window.innerWidth / cols)) + 2;
  for (let i = 0; i < cols * rows; i++) {
    const d = document.createElement('div');
    d.className = 'bg-die' + (Math.random() < .16 ? ' lit' : '');
    const face = BG_FACES[Math.floor(Math.random() * 6)];
    for (let c = 1; c <= 9; c++) {
      const cc = document.createElement('div');
      cc.className = 'dot-cell';
      if (face.includes(c)) {
        const dot = document.createElement('div');
        dot.className = 'bg-dot';
        cc.appendChild(dot);
      }
      d.appendChild(cc);
    }
    bgGrid.appendChild(d);
  }
}
buildBg();
window.addEventListener('resize', buildBg);
setInterval(() => {
  const all = document.querySelectorAll('.bg-die');
  if (all.length) all[Math.floor(Math.random() * all.length)].classList.toggle('lit');
}, 280);
</script>
</body>
</html>
